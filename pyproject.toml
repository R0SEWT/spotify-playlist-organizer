[project]
name = "spotify-playlist-organizer"
version = "0.1.0"
description = "Flask web app that organizes Spotify liked songs into playlists using K-means clustering and cosine-similarity recommendations."
readme = "README.MD"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.1",
    "Werkzeug>=3.1.3",
    "Jinja2>=3.1.6",
    "MarkupSafe>=2.1.5",
    "itsdangerous>=2.2.0",
    "click>=8.1.7",
    "blinker>=1.8.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
    "urllib3>=2.2.2",
    "certifi>=2024.7.4",
    "idna>=3.7",
    "charset-normalizer>=3.3.2",
    "spotipy>=2.24.0",
    "mongoengine>=0.29.1",
    "pymongo>=4.6.3",
    "dnspython>=2.6.1",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
    "threadpoolctl>=3.5.0",
    "redis>=5.0.7",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
eda = [
    "matplotlib",
    "seaborn",
    "plotly-express",
    "yellowbrick",
    "nbformat",
    "tqdm",
]

[tool.uv]
package = false
